<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d12" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("atelier-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#e6dfd4" : "#0c0d12");
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Atelier is a digital wardrobe. Photograph clothes you own, lift the background, and file them into outfits, a calendar, and color pairings."
    />
    <title>Atelier</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
